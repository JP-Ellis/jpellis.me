---
name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  completion:
    name: Deploy completion check
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - run: exit 1

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1

      - name: Build
        run: aubr build

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config dist/server/wrangler.json
