[package]
name = "colorspace-viz"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
three-d = { version = "0.19", default-features = false, features = [
  "wasm-bindgen",
  "web-sys"
] }
wasm-bindgen = "0.2"

  [dependencies.web-sys]
  version = "0.3"
  features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlSelectElement",
    "ImageData",
    "MouseEvent",
    "Node",
    "Performance",
    "PointerEvent",
    "Text",
    "WebGl2RenderingContext",
    "WheelEvent",
    "Window",
  ]

[dev-dependencies]
approx = "0.5"

[lints]
workspace = true
